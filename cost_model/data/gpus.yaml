# GPU platforms. One "node" = the unit you buy/rent: an 8-GPU server, or a 72-GPU NVL72 rack.
# Specs: vendor datasheets (dense, no sparsity). Prices: research_notes/.../hardware_prices.md (USD, ex-tax, ex-shipping, Oct 2026).
# Cloud rates: research_notes/Self hosting LLM cost Pune/cloud_rental_prices.md (ex-GST, Oct 2026). 0 = not offered.
gpus:
