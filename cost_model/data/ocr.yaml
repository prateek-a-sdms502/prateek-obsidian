# Chandra OCR 2 (4.66B, Qwen3.5-4B base; 10.6 GB BF16). Sized by pages/hour.
# Throughput anchor: 1.44 pages/s on one H100 80GB, vLLM, 96 concurrent, Datalab's hard olmOCR mix
# (Datalab estimates ~2 pages/s on real-world documents). Decode is KV/HBM-bandwidth bound, so other
# GPUs are scaled by memory bandwidth (H100 SXM 3.35 TB/s). FP8 weights+KV ~1.6x; FP32 ~0.4x (2x bytes).
# LICENSE: weights are modified OpenRAIL-M - no commercial use by entities with >$2M revenue/funding
# without a paid Datalab license (cost not included here).
tiers: {light: 1000, medium: 10000, heavy: 50000}
gpus:
  l40s:
    label: NVIDIA L40S 48 GB (4-GPU server)
    q_gpus_per_srv: 4
