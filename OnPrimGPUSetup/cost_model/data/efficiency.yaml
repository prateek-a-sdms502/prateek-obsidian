# Serving-efficiency coefficients. Overrides are written by calibrate.py --write.
default:
  e_mem_util:
    value: 0.9
    source: vLLM gpu_memory_utilization / SGLang mem_fraction_static default
  e_overhead_gb:
    value: 10
    source: 'ASSUMPTION: CUDA graphs, activations, DeepEP/NCCL buffers, prefill workspace per GPU'
  e_bw_eff:
    value: 0.7
    source: ASSUMPTION before calibration
  e_flop_eff:
    value: 0.35
    source: 'ASSUMPTION: decode MFU on grouped-GEMM MoE'
  e_pf_eff:
    value: 0.45
    source: 'ASSUMPTION: prefill MFU'
  e_xnode_lat_us:
    value: 120
    source: 'ASSUMPTION: cross-node all-to-all latency over 400G IB/RoCE'
  e_frag:
    value: 1.1
    source: 'ASSUMPTION: paged-KV imbalance across DP ranks/replicas'
  e_max_batch:
    value: 256
    source: Typical max running sequences per replica
  e_min_batch:
    value: 8
    source: 'ASSUMPTION: a replica must hold at least 8 sequences at mean context'
  e_dp_attn:
    value: 1
    source: SGLang/vLLM DP-attention + expert parallelism (GLM-5.3 cookbook, DSv4 vLLM recipe DP8+EP)
  e_seq_us:
    value: 300
    source: Replaced by calibration
